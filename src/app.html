<!doctype html>
<html lang="en" data-theme="light" data-route-family="pending">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f2f5f9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0e1523" media="(prefers-color-scheme: dark)" />
		<!-- No static meta description here: every public page sets its own
		     localized one via <svelte:head>, which does not de-duplicate — a
		     global fallback would emit a second, English-first description. -->
		<meta property="og:type" content="website" />
		<!-- og:title / og:description / og:image / twitter:image are all set per
		     route (localized) in each page's <svelte:head>; a global fallback
		     would emit twice in SSR HTML because <svelte:head> does not
		     de-duplicate identical `property`s — and the static copy would be
		     English-only. -->
		<meta name="twitter:card" content="summary_large_image" />

		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="/brand/app-icon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/brand/app-icon-16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/brand/app-icon-180.png" />
		<link rel="manifest" href="/brand/site.webmanifest" />
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('memenow.theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.setAttribute('data-theme', theme);
				} catch (_e) {
					// Ignore storage failures (private mode, etc).
				}
			})();
		</script>
		<!-- Motion-preference boot. Unlike data-theme, <html> ships NO static
		     data-motion: its absence is exactly what lets the CSS
		     `:root:not([data-motion])` fallback honor the OS prefers-reduced-motion
		     query when scripting is off. With scripting on, this writes the attribute
		     (stored choice, else the OS setting) before first paint, and from then on
		     the attribute is the single source of truth (see tokens.css + motion.ts). -->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('memenow.motion');
					var motion =
						stored === 'full' || stored === 'reduced'
							? stored
							: window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
								? 'reduced'
								: 'full';
					document.documentElement.setAttribute('data-motion', motion);
				} catch (_e) {
					// Ignore storage failures (private mode, etc).
				}
			})();
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@graph": [
					{
						"@type": "Organization",
						"@id": "https://memenow.xyz/#organization",
						"name": "memenow",
						"url": "https://memenow.xyz",
						"logo": "https://memenow.xyz/brand/mark.png",
						"sameAs": ["https://github.com/memenow"]
					},
					{
						"@type": "WebSite",
						"@id": "https://memenow.xyz/#website",
						"url": "https://memenow.xyz",
						"name": "memenow",
						"publisher": { "@id": "https://memenow.xyz/#organization" }
					}
				]
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
